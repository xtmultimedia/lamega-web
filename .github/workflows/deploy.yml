name: Deploy to FastComet

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys/restarts at once (NPROC safety on the shared host).
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (standalone)
        run: npm run build

      - name: Assemble standalone bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.FASTCOMET_SSH_KEY }}
        run: |
          # Only write the key here (no network calls, so this step can't flake).
          # Host key is trusted on first use via StrictHostKeyChecking=accept-new
          # in the rsync/restart steps, whose retries absorb transient NPROC.
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy via rsync
        env:
          SSH_HOST: ${{ secrets.FASTCOMET_SSH_HOST }}
          SSH_PORT: ${{ secrets.FASTCOMET_SSH_PORT }}
          SSH_USER: ${{ secrets.FASTCOMET_SSH_USER }}
        run: |
          # --delete keeps the server clean of stale build files, but .env (prod
          # secrets) and public/uploads (user-uploaded media) are protected.
          # Retry: the shared host's NPROC limit can transiently refuse new forks.
          n=0
          until rsync -az --delete \
              --exclude='.env' \
              --exclude='public/uploads' \
              -e "ssh -p $SSH_PORT -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
              .next/standalone/ \
              "$SSH_USER@$SSH_HOST:/home/producci/lamegaecuador.com/.next/standalone/"; do
            n=$((n+1))
            if [ "$n" -ge 6 ]; then echo "::error::rsync failed after $n attempts (server NPROC limit?)"; exit 1; fi
            echo "rsync attempt $n failed — retrying in 25s…"
            sleep 25
          done

      - name: Restart Passenger
        env:
          SSH_HOST: ${{ secrets.FASTCOMET_SSH_HOST }}
          SSH_PORT: ${{ secrets.FASTCOMET_SSH_PORT }}
          SSH_USER: ${{ secrets.FASTCOMET_SSH_USER }}
        run: |
          n=0
          until ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
              "touch /home/producci/lamegaecuador.com/tmp/restart.txt"; do
            n=$((n+1))
            if [ "$n" -ge 6 ]; then echo "::error::restart touch failed after $n attempts"; exit 1; fi
            echo "restart attempt $n failed — retrying in 20s…"
            sleep 20
          done

      - name: Smoke test
        run: |
          # Passenger cold-starts on the first request after a restart; poll until
          # it serves 200 (up to ~2.5 min). Use a browser UA — FastComet's WAF
          # treats the runner's datacenter IP differently than real visitors.
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          echo "Waiting for Passenger to cold-start…"
          code="000"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" --max-time 20 https://lamegaecuador.com || echo "000")
            echo "attempt $i: home=$code"
            [ "$code" = "200" ] && { echo "Site serving 200 ✅"; exit 0; }
            sleep 8
          done
          # No 200 from CI. If the edge is responding (not 5xx/000) it's almost
          # certainly the host WAF challenging the runner IP — rsync+restart already
          # succeeded, so warn instead of failing the deploy.
          case "$code" in
            403|406|415|429)
              echo "::warning::Site returned $code to the CI runner (likely WAF on the GitHub IP). Deploy (rsync+restart) succeeded — verify from a browser at https://lamegaecuador.com"
              exit 0 ;;
            *)
              echo "::error::Site returned $code after deploy — the app may be down"
              exit 1 ;;
          esac
